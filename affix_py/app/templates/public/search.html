{% extends "base.html" %}

{% block title %}Search | Affix{% endblock %}

{% block content %}
  <section class="page-heading">
    <p class="eyebrow">Search</p>
    <h1>Find posts</h1>
  </section>

  <form
    class="search-box search-box--full"
    hx-get="{{ url_for('public.search') }}"
    hx-target="#search-results"
    hx-push-url="true"
  >
    <label for="search-q">Search query</label>
    <div class="search-box__controls">
      <input id="search-q" name="q" type="search" value="{{ query }}" placeholder="Search by title, content, or tags">
      <button type="submit">Search</button>
    </div>
  </form>

  <div id="search-results">
    {% include "partials/search_results.html" %}
  </div>
{% endblock %}
