name: build-and-push

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Optional extra tag (e.g. hotfix-123)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PIP_VERSION: '26.2.1'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pin pip and verify versions
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python --version
          pip --version
          test "$(python -V)" = "Python $(cat .python-version)"
          test "$(pip --version | awk '{print $2}')" = "${PIP_VERSION}"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "python=$(tr -d '[:space:]' < .python-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v7
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=build-${{ github.run_number }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.extra_tag || 'unused' }},enable=${{ inputs.extra_tag != '' }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: smoke:test
          build-args: |
            PYTHON_VERSION=${{ steps.vars.outputs.python }}
            PIP_VERSION=${{ env.PIP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run --rm smoke:test python --version
          docker run --rm smoke:test pip --version
          docker run -d --name smoke -p 5000:5000 \
            -e SECRET_KEY=ci-only-not-a-secret \
            smoke:test
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          echo "HTTP status: $code"
          docker logs smoke
          docker rm -f smoke
          [ "$code" != "000" ]

      - id: push
        name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ steps.vars.outputs.python }}
            PIP_VERSION=${{ env.PIP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo "Python: ${{ steps.vars.outputs.python }}, pip: ${{ env.PIP_VERSION }}"
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
