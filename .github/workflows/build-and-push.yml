name: build-and-push

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Optional extra tag (e.g. hotfix-123)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_DIR: 'affix_py'            # set to "affix_py" if the app lives in a subfolder
  PYTHON_VERSION: '3.13'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image name
      - id: vars
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=build-${{ github.run_number }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.extra_tag || 'unused' }},enable=${{ inputs.extra_tag != '' }}

      # Build locally first (no push) so we can test the real image
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          push: false
          tags: smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e SECRET_KEY=ci-only-not-a-secret \
            smoke:test
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          echo "HTTP status: $code"
          docker logs smoke
          docker rm -f smoke
          [ "$code" != "000" ]

      # Cache hit from the previous build, so this is fast
      - id: push
        name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
