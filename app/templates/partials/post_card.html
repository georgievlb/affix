<article class="post-card {{ 'first-post-card' if loop_index|default(-1) == 0 else 'not-first-post-card' }}">
  <a class="post-card__link" href="{{ url_for('public.post_details', moniker=post.moniker) }}">
    <header class="post-card__header">
      <div class="post-card__header-meta">
        <span class="post-card__header-label">{{ post.header or (post.category.name if post.category else "Published post") }}</span>
        <div class="header-icon {{ post.category.name if post.category else '' }}"></div>
      </div>
      <h3>{{ post.title }}</h3>
      <p class="post-card__date">{{ post.date.strftime("%B %d, %Y") }}</p>
    </header>
    {% if post.image %}
      <div class="post-card__media">
        <img
          src="{{ url_for('public.image_asset', image_id=post.image.id) }}"
          alt="{{ post.image_alt_text or post.image.alt_text or post.title }}"
        >
      </div>
    {% endif %}
    <div class="post-card__content">
      <p>{{ post.summary or "Open the article to read the full post." }}</p>
    </div>
  </a>
</article>
